<style>
  :root {

<script>
(function(){

  var pendingDelete = false;
  var replyingTo = null;
  var aiBusy = false;
  var saveQueue = Promise.resolve();
  var dirty = false;
  var lastLocalMutation = 0;

  var MOODS = {
    work:   { label: '工作吐槽', emoji: '😤', tint: 'var(--tint-work)' },
    life:   { label: '生活瑣事', emoji: '🌙', tint: 'var(--tint-life)' },
    values: { label: '人生觀', emoji: '🌱', tint: 'var(--tint-values)' },

  var submitBtn = form.querySelector('button[type="submit"]');
  var closeNoteBtn = document.getElementById('closeNote');

  function fmtTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    return d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate() + ' ' +
      String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  function setStatus(msg, isError) {
    statusEl.textContent = msg || '';
    statusEl.classList.toggle('error', !!isError);
  }
  function latestActivity(box) {
    var latest = box.ts || 0;
    (box.replies || []).forEach(function(r){ latest = Math.max(latest, r.ts || 0); });
    return latest;
  }
  function replyChars(box) {
    return (box.replies || []).reduce(function(n,r){ return n + Array.from(r.text || '').length; }, 0);
  }
  function isUnread(box) {
    var readAt = (state.readBy && state.readBy[userId] && state.readBy[userId][box.id]) || 0;
    return latestActivity(box) > readAt;
  }
  function sortedBoxes() {
    return state.boxes.slice().sort(function(a,b){
      var ca = replyChars(a), cb = replyChars(b);
      if (cb !== ca) return cb - ca;
      return latestActivity(b) - latestActivity(a);
    });
  }
  function renderLastOpened() {
    if (userId === 'A' && state.lastOpenedAt) {
      lastOpenedEl.style.display = '';
      lastOpenedEl.textContent = '最近一次有盒子被拆開：' + fmtTime(state.lastOpenedAt);
    } else {
      lastOpenedEl.style.display = 'none';
      lastOpenedEl.textContent = '';

  }
  function renderPingStatus() {
    // Yun（使用者 B）不顯示「最近一次點了我在線上，聊聊？」時間；只有 A 可見。

      pingStatusEl.style.display = '';
      pingStatusEl.textContent = '最近一次點了「我在線上，聊聊？」：' + fmtTime(state.onlinePingAt);
    } else {
      pingStatusEl.style.display = 'none';
      pingStatusEl.textContent = '';
    }
  }
  function render() {
    renderLastOpened();
    renderPingStatus();
    renderPet();
    renderGameEvent();
    grid.innerHTML = '';
    sortedBoxes().forEach(function(box){
      var mood = MOODS[box.mood] || MOODS.random;

  function mutate() {

  function queueSave() {
    saveQueue = saveQueue.then(function(){
      if (!dirty) return true;
      var snapshot = JSON.stringify(state);
      dirty = false;
      return fetch(API + '/api/state', {
        method: 'PUT',
        headers: {'Content-Type':'application/json','X-Access-Code':accessCode},
        body: snapshot
      }).then(function(res){
        if (!res.ok) throw new Error('儲存失敗（HTTP ' + res.status + '）');
        setStatus('已同步');
        return true;
      }).catch(function(err){
        dirty = true;
        setStatus(err.message || '同步失敗，請檢查網路後重試。', true);
        return false;
      });
    });
    return saveQueue;

  async function uploadImage(file) {
    if (!file) return null;
    if (!file.type || !file.type.startsWith('image/')) throw new Error('請選擇圖片檔案。');
    if (file.size > 8 * 1024 * 1024) throw new Error('圖片需小於 8 MB，請先壓縮再上傳。');
    var data = new FormData();
    data.append('photo', file, file.name);
    var res = await fetch(API + '/api/upload', {
      method: 'POST',
      headers: {'X-Access-Code': accessCode},
      body: data
    });
    var result = await res.json().catch(function(){ return {}; });
    if (!res.ok || !result.file_id) throw new Error(result.error || '圖片上傳失敗（HTTP ' + res.status + '）');
    return result.file_id;
  }

  }
  function eventLabel(type) {
    return ({guess:'小雲發現一個線索', truth:'小雲想問你一件事', dare:'小雲說：來玩一個小挑戰', topic:'小雲想到一個可以聊的', memory:'小雲記得一件事', cat:'小雲突然來撒嬌'})[type] || '小雲有個小遊戲';

  function renderGameEvent() {
    var ev = state.game && state.game.activeEvent;
    if (!ev || !ev.id) {
      hideGameEvent();
      return;
    }
    var dismissed = Array.isArray(ev.dismissedBy) && ev.dismissedBy.indexOf(userId) >= 0;
    if (ev.completedAt || dismissed) {
      if (currentGameEventId === ev.id) hideGameEvent();
      return;
    }
    currentGameEventId = ev.id;
    gameMascot.textContent = eventEmoji(ev.type);
    gameEyebrow.textContent = eventLabel(ev.type);

    gameChoices.innerHTML = '';
    gameActionRow.innerHTML = '';
    gameReward.textContent = '';
    var choices = Array.isArray(ev.choices) ? ev.choices : [];
    if ((ev.type === 'guess' || ev.type === 'memory') && choices.length) {
      choices.slice(0,2).forEach(function(choice, idx){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'gameChoice'; b.textContent = choice;
        b.addEventListener('click', function(){ submitGameAction('choice', idx); });
        gameChoices.appendChild(b);

      var b = document.createElement('button');
      b.type='button'; b.className='gameAction';
      if (ev.type === 'topic') b.textContent = '帶入這個話題';
      else if (ev.type === 'dare') b.textContent = '完成挑戰';
      else if (ev.type === 'truth') b.textContent = '我來回答';
      else b.textContent = '摸摸小雲';
      b.addEventListener('click', function(){ submitGameAction('complete', null); });
      gameActionRow.appendChild(b);
    }
    if (gameOverlay.classList.contains('hidden')) gameOverlay.classList.remove('hidden');

  async function checkAIEvent(boxId, replyId) {
    if (gameBusy) return;
    if (!accessCode || !boxId) return;
    var box = state.boxes.find(function(b){ return b.id === boxId; });
    if (!box || !Array.isArray(box.replies) || !box.replies.length) return;
    var latest = box.replies[box.replies.length - 1];
    if (replyId && latest.id !== replyId) return;
    if (!latest.id || seenReplyIds[latest.id]) return;
    var latestText = String(latest.text || '').trim();
    if (latestText.length < 2 && !/[?？!！。~～😂🤣😆]/u.test(latestText)) return;
    seenReplyIds[latest.id] = true;
    try {
      var res = await fetch(API + '/api/ai-event', {
        method:'POST',
        headers:{'Content-Type':'application/json','X-Access-Code':accessCode},
        body:JSON.stringify({boxId:boxId, replyId:latest.id})
      });
      var result = await res.json().catch(function(){ return {}; });
      if (result && result.game) {
        state.game = result.game;
        renderPet();
      }
      if (result && result.event) {
        state.game = state.game || {};
        state.game.activeEvent = result.event;
        renderGameEvent();
      }
    } catch (_) {}
  }

  async function submitGameAction(action, value) {
    if (gameBusy) return;
    var ev = state.game && state.game.activeEvent;
    if (!ev || !ev.id) return;
    gameBusy = true;
    gameChoices.querySelectorAll('button').forEach(function(b){b.disabled=true;});
    gameActionRow.querySelectorAll('button').forEach(function(b){b.disabled=true;});
    try {
      var res = await fetch(API + '/api/game-action', {
        method:'POST',
        headers:{'Content-Type':'application/json','X-Access-Code':accessCode},
        body:JSON.stringify({eventId:ev.id, action:action, value:value})
      });
      var result = await res.json().catch(function(){ return {}; });
      if (!res.ok || !result.ok) throw new Error(result.error || '遊戲處理失敗');
      if (ev.type === 'topic' && action === 'complete' && ev.prompt) {
        textInput.value = ev.prompt;
        textInput.focus();
      }
      state.game = result.game || state.game;
      renderPet();
      gameReward.textContent = result.message || '';
      setStatus(result.message || '遊戲完成');
      setTimeout(function(){
        if (result.game) renderGameEvent(); else hideGameEvent();
      }, 500);
      render();
    } catch (err) {
      gameReward.textContent = err.message || '遊戲暫時無法更新';
      gameChoices.querySelectorAll('button').forEach(function(b){b.disabled=false;});
      gameActionRow.querySelectorAll('button').forEach(function(b){b.disabled=false;});
    } finally {
      gameBusy = false;
    }
  }

  async function startGameManually() {
    if (gameBusy || !accessCode) return;
    var active = state.game && state.game.activeEvent;
    if (active && active.id && !active.completedAt) {
      renderGameEvent();
      setStatus('現在已經有一個小遊戲在進行。');
      return;
    }
    var candidates = state.boxes.slice().sort(function(a,b){ return latestActivity(b) - latestActivity(a); });
    var box = candidates.find(function(b){ return Array.isArray(b.replies) && b.replies.length; }) || candidates[0];
    if (!box) { setStatus('先放進一個盲盒，再來玩遊戲。', true); return; }
    gameBusy = true;
    startGameBtn.disabled = true;
    startGameBtn.textContent = '🎲 AI 正在想…';
    try {
      var latest = Array.isArray(box.replies) && box.replies.length ? box.replies[box.replies.length - 1] : null;
      var res = await fetch(API + '/api/ai-event', {
        method:'POST',
        headers:{'Content-Type':'application/json','X-Access-Code':accessCode},
        body:JSON.stringify({boxId:box.id, replyId:latest ? latest.id : '', manual:true})
      });
      var result = await res.json().catch(function(){ return {}; });
      if (!res.ok) throw new Error(result.error || '遊戲啟動失敗');
      if (result.game) state.game = result.game;
      if (result.event) {
        state.game = state.game || {};
        state.game.activeEvent = result.event;
        renderGameEvent();
        setStatus('小雲幫你們開了一局。');
      } else {
        renderPet();
        setStatus(result.reason || 'AI 暫時沒有想到適合的玩法。');
      }
    } catch (err) {
      setStatus(err.message || '遊戲啟動失敗', true);
    } finally {
      gameBusy = false;
      startGameBtn.disabled = false;
      startGameBtn.textContent = '🎲 發起遊戲';
    }
  }

  async function skipGameEvent() {
    var ev = state.game && state.game.activeEvent;
    if (!ev || !ev.id || gameBusy) return;
    gameBusy = true;
    try {
      var res = await fetch(API + '/api/game-action', {
        method:'POST', headers:{'Content-Type':'application/json','X-Access-Code':accessCode},
        body:JSON.stringify({eventId:ev.id, action:'dismiss'})
      });
      var result = await res.json().catch(function(){ return {}; });
      if (result && result.game) state.game = result.game;
      hideGameEvent();
      renderPet();
    } catch (_) { hideGameEvent(); }
    finally { gameBusy = false; }
  }

  async function submitReply() {
    if (!openBoxId) return;
    var text = replyInput.value.trim();
    var file = replyImageInput.files && replyImageInput.files[0];
    if (!text && !file) return;
    var box = state.boxes.find(function(b){return b.id === openBoxId;});
    if (!box) return;
    sendReplyBtn.disabled = true;
    try {
      setStatus('正在上傳回覆…');
      var imageFileId = file ? await uploadImage(file) : null;
      box.replies = box.replies || [];
      box.replies.push({
        id: 'r' + Date.now() + Math.random().toString(16).slice(2,6),
        text: text, imageFileId: imageFileId, ts: Date.now(), by: userId,
        replyTo: replyingTo ? Object.assign({}, replyingTo) : null
      });
      replyInput.value = '';
      replyImageInput.value = '';
      replyImageName.textContent = '';
      renderReplies(box);
      setReplyQuote(null);
      state.readBy[userId][box.id] = Date.now();
      var replySavePromise = mutate();
      setStatus('回覆已送出');
      replySavePromise.then(function(saved){
        if (saved) setTimeout(function(){ checkAIEvent(box.id, box.replies[box.replies.length - 1].id); }, 80);
      });
      if ((box.replies || []).length - (box.aiReplyCount || 0) >= 5) {
        replySavePromise.then(function(saved){
          if (saved) setTimeout(function(){ refreshAICover(box, false); }, 50);
        });
      }
    } catch (err) {
      setStatus(err.message || '圖片上傳失敗', true);
    } finally {
      sendReplyBtn.disabled = false;
    }
  }

    }
    textInput.focus();
    aiTopicUseBtn.style.display = 'none';
  });

  pingBtn.addEventListener('click', function(){
    state.onlinePingAt = Date.now();
    pingBtn.classList.add('sent');
    setTimeout(function(){pingBtn.classList.remove('sent');},1200);
    mutate();
    setStatus('已送出上線訊號');
  });

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    var text = textInput.value.trim();
    var file = boxImageInput.files && boxImageInput.files[0];
    if (!text && !file) { setStatus('請輸入文字或附上一張圖片。', true); return; }
    if (state.boxes.length >= MAX_BOXES) {
      setStatus('目前最多 5 個盒子，請先刪除一個。', true);
      return;
    }
    submitBtn.disabled = true;
    try {
      setStatus(file ? '正在上傳圖片…' : '正在建立盲盒…');
      var imageFileId = file ? await uploadImage(file) : null;
      var checked = form.querySelector('input[name="mood"]:checked');
      var newBox = {
        id:'b'+Date.now()+Math.random().toString(16).slice(2,6),
        text:text, imageFileId:imageFileId, mood:checked ? checked.value : 'life',
        ts:Date.now(), replies:[], aiReplyCount:0
      };
      state.boxes.push(newBox);
      textInput.value = '';
      boxImageInput.value = '';
      boxImageName.textContent = '';
      var savedNewBox = await mutate();
      setStatus(savedNewBox ? '盲盒已建立，AI 正在分析主題…' : '盲盒已建立，正在等待同步…');
      if (savedNewBox) {
        try {
          await refreshAICover(newBox, false);
        } catch (_) {}
      }
    } catch (err) {
      setStatus(err.message || '建立盲盒失敗', true);
    } finally {
      submitBtn.disabled = false;
    }
  });

  function normalizeState(s) {
    s = s && typeof s === 'object' ? s : {};
    s.boxes = Array.isArray(s.boxes) ? s.boxes : [];
    s.boxes.forEach(function(b){
      if(!Array.isArray(b.replies)) b.replies = [];
      b.aiTitle = b.aiTitle || '';
      b.aiTheme = b.aiTheme || '';
      b.aiSummary = b.aiSummary || '';
      b.aiCoverFileId = null;
      b.aiReplyCount = Number.isFinite(b.aiReplyCount) ? b.aiReplyCount : (b.replies.length ? 0 : 0);
      b.replies.forEach(function(r){ r.replyTo = r.replyTo || null; });
    });
    s.readBy = s.readBy && typeof s.readBy === 'object' ? s.readBy : {};
    s.lastOpenedAt = s.lastOpenedAt || null;
    s.onlinePingAt = s.onlinePingAt || null;
    s.game = s.game && typeof s.game === 'object' ? s.game : {
      xp: 0, level: 1, achievements: [], pet: { name: '小雲', xp: 0, level: 1, mood: '今天心情不錯' }, activeEvent: null, history: []
    };
    s.game.achievements = Array.isArray(s.game.achievements) ? s.game.achievements : [];
    s.game.history = Array.isArray(s.game.history) ? s.game.history : [];
    s.game.pet = s.game.pet && typeof s.game.pet === 'object' ? s.game.pet : { name: '小雲', xp: 0, level: 1, mood: '今天心情不錯' };
    return s;
  }
  function loadState() {
    return fetch(API + '/api/state', {
      headers: {'X-Access-Code':accessCode}
    }).then(function(res){
      if(res.status === 401) throw new Error('通行碼錯誤，請重新整理並輸入正確通行碼。');
      if(!res.ok) throw new Error('讀取失敗（HTTP ' + res.status + '）');
      return res.json();
    }).then(function(payload){
      userId = payload.user;
      state = normalizeState(payload.state);
      render();
      setStatus('');
      // 僅在通行碼驗證成功、雲端資料載入成功後發送 Telegram 通知
      notifyVisit();
    });
  }
  function notifyVisit() {
    fetch(API + '/api/visit', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({event:'盲盒網站登入成功｜使用者：' + (userId === 'A' ? 'A' : userId === 'B' ? 'B' : userId)}),
      keepalive:true
    }).catch(function(){});
  }

  if (!accessCode) {
    accessCode = window.prompt('請輸入你的盲盒信箱通行碼（由信箱建立者提供）') || '';
  }
  if (!accessCode) {
    setStatus('尚未輸入通行碼。重新整理頁面即可再試。', true);
    form.querySelectorAll('input,textarea,button').forEach(function(el){el.disabled=true;});
    return;
  }
  sessionStorage.setItem('blindbox_access_code', accessCode);

  loadState().then(function(){
    // 先顯示盒子，再補齊舊盒子的 AI 對話摘要封面。
    window.setTimeout(function(){
      ensureMissingAICovers().catch(function(){});
      state.boxes.forEach(function(b){
        if (b.replies && b.replies.length) checkAIEvent(b.id, b.replies[b.replies.length - 1].id);
      });
    }, 150);
    window.setInterval(function(){
      if (dirty || Date.now() - lastLocalMutation < 2500) return;
      fetch(API + '/api/state', {
        headers:{'X-Access-Code':accessCode}
      }).then(function(res){
        if(!res.ok) return;
        return res.json();
      }).then(function(payload){
        if(!payload || dirty) return;
        state = normalizeState(payload.state);
        render();
        state.boxes.forEach(function(b){
          if (b.replies && b.replies.length) checkAIEvent(b.id, b.replies[b.replies.length - 1].id);
        });
        if(openBoxId) {
          var current = state.boxes.find(function(b){return b.id === openBoxId;});
          if(current) {
            noteText.textContent = current.text || '';
            noteImage.style.display = current.imageFileId ? 'block' : 'none';
            noteImage.src = current.imageFileId ? API + '/api/image?file_id=' + encodeURIComponent(current.imageFileId) : '';
            renderReplies(current);
            renderAiCover(current);
          } else closeNote();
        }
      }).catch(function(){});
    }, POLL_MS);
  }).catch(function(err){
    sessionStorage.removeItem('blindbox_access_code');
    setStatus(err.message || '無法連接雲端 API。', true);
    window.alert(err.message || '無法連接雲端 API。請確認 Worker 已部署。');
  });
})();
</script>

  .unreadDot { position:absolute; top:7px; left:7px; width:9px; height:9px; border-radius:50%; background:#ff4d67; box-shadow:0 0 0 3px rgba(255,77,103,.18); z-index:3; }
</style>
