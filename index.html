<body>
<div class="mesh"></div>
<main>
  <header>
    <div class="statusLine"><span class="dot"></span>私人頻道 · 連線中</div>
    <h1>Frank &amp; Yuan 的小宇宙</h1>
    <p class="usageHint">把想說的放進盲盒 → 回來看看彼此的回覆 → AI 會在適合的時候叫小雲出來玩。</p>
    <span id="lastOpened" class="lastOpened" style="display:none;"></span>
    <div class="pingRow">
      <div class="headerActions">
        <button id="pingBtn" type="button" class="pingBtn">💬 我在線上,聊聊?</button>
        <button id="startGameBtn" type="button" class="startGameBtn">🎲 發起遊戲</button>
      </div>
      <span id="pingStatus" class="pingStatus" style="display:none;"></span>
    </div>
  </header>

  <section id="boxGrid" class="grid"></section>

  <section id="petBar" class="petBar" style="display:none;">
    <div class="petHud"><span class="petHudFace">🐾</span><div><span class="petHudName" id="petName">小雲</span><span class="petLevel">Lv.<span id="petLevel">1</span></span><span id="petMood" class="petMood">今天心情不錯</span><span class="petHint">像素貓咪 · 點牠、拖牠、滑牠都會有反應</span></div></div>
    <div class="petProgressWrap"><div class="petProgress"><span id="petXpFill"></span></div><div id="petXpText" class="petXpText">0 / 100</div></div>
  </section>

  <div id="petWanderLayer" class="petWanderLayer" aria-hidden="true">
    <div id="petActor" class="petActor" role="button" tabindex="0" aria-label="小雲，會自己到處跑的像素貓咪" data-dir="1">
      <div class="petShadow"></div>
      <canvas id="petCanvas" class="petSvg petCanvas" width="80" height="56" role="img" aria-label="小雲，橘白像素貓咪"></canvas>
    </div>
    <div id="petBubble" class="petBubble"></div>
  </div>

  <form id="addForm">
    <div class="moods">
      <label><input type="radio" name="mood" value="work"><span>😤 工作吐槽</span></label>
      <label><input type="radio" name="mood" value="life" checked=""><span>🌙 生活瑣事</span></label>
      <label><input type="radio" name="mood" value="values"><span>🌱 人生觀</span></label>
      <label><input type="radio" name="mood" value="share"><span>🌤️ 開心分享</span></label>
      <label><input type="radio" name="mood" value="random"><span>🎲 隨便說說</span></label>
    </div>
    <div class="topicRow">
      <button id="aiTopicBtn" type="button" class="aiTopicBtn">✦ AI 想話題</button>
      <span id="aiTopicHint" class="aiTopicHint">讓 AI 根據最近的聊天內容想一個自然的開場</span>
      <button id="aiTopicUseBtn" type="button" class="aiTopicUseBtn" style="display:none;">帶入</button>
    </div>
    <textarea id="boxText" placeholder="寫下你想說的話,或問問她今天有什麼開心事、想不想傳張照片……"></textarea>
    <div class="imagePickRow">
      <label class="imagePick">📷 附上一張圖片<input id="boxImageInput" type="file" accept="image/*" hidden></label>
      <span id="boxImageName" class="imageName"></span>
    </div>
    <div class="formFooter">
      <span id="status"></span>
      <button type="submit" class="submit">包起來,放進去 🎁</button>
    </div>
  </form>
</main>

<div id="gameOverlay" class="gameOverlay hidden" aria-live="polite">
  <div class="gameCard">
    <button id="gameClose" type="button" class="gameClose" aria-label="暫時不玩">✕</button>
    <div id="gameMascot" class="gameMascot">🐱</div>
    <div id="gameEyebrow" class="gameEyebrow">小雲剛剛想到一個</div>
    <div id="gameTitle" class="gameTitle"></div>
    <div id="gamePrompt" class="gamePrompt"></div>
    <div id="gameChoices" class="gameChoices"></div>
    <div id="gameActionRow" class="gameActionRow"></div>
    <div id="gameReward" class="gameReward"></div>
    <button id="gameSkip" type="button" class="gameSkip">先不要，繼續聊天</button>
  </div>
</div>

<div id="noteOverlay" class="overlay hidden">
  <div class="note">
    <div class="noteTop">
      <p id="noteMeta"></p>
      <button id="deleteBox" class="iconBtn danger" aria-label="刪除這個盒子" title="刪除">🗑</button>
      <button id="closeNote" class="iconBtn" aria-label="關閉">✕</button>
    </div>
    <p id="noteText"></p>
    <div class="noteActionRow">
      <button id="quoteBoxBtn" type="button" class="quoteBtn">↩ 引用這句</button>
      <button id="aiRefreshBtn" type="button" class="aiBtn">✦ AI 更新摘要</button>
    </div>
    <div id="aiCoverPanel" class="aiCoverPanel">
      <div class="aiCoverInfo">
        <div id="aiCoverTitle" class="aiCoverTitle"></div>
        <div id="aiCoverTheme" class="aiCoverTheme"></div>
        <div id="aiCoverSummary" class="aiCoverSummary"></div>
        <div class="aiCoverSummary" style="margin-top:6px;opacity:.55;">封面以文字呈現，會隨聊天內容自動更新。</div>
      </div>
    </div>
    <img id="noteImage" class="attachedImage" alt="盲盒附圖" style="display:none">
    <div id="repliesList" class="replies"></div>
    <div id="quoteComposer" class="quoteComposer">
      <div class="quoteComposerTop"><span>正在引用</span><button id="cancelQuote" type="button" class="cancelQuoteBtn">取消</button></div>
      <div id="quoteComposerText" class="quoteComposerText"></div>
    </div>
    <div class="replyRow">
      <input id="replyInput" class="replyInput" type="text" placeholder="回這句話……" maxlength="300">
      <button id="sendReply" class="sendReply" type="button">回覆</button>
    </div>
    <div class="imagePickRow replyImageRow">
      <label class="imagePick">📷 附圖回覆<input id="replyImageInput" type="file" accept="image/*" hidden></label>
      <span id="replyImageName" class="imageName"></span>
    </div>
  </div>
</div>

<script id="app-state" type="application/json">{"boxes":[],"lastOpenedAt":null,"readBy":{},"onlinePingAt":null}</script>
<script>
(function(){
  'use strict';

  var API = 'https://yun-online-notice.frank8771919.workers.dev';
  var MAX_BOXES = 5;
  var POLL_MS = 8000;
  var accessCode = sessionStorage.getItem('blindbox_access_code') || '';
  var userId = '';
  var state = { boxes: [], lastOpenedAt: null, readBy: {}, onlinePingAt: null };
  var openBoxId = null;
  var pendingDelete = false;
  var replyingTo = null;
  var aiBusy = false;
  var saveQueue = Promise.resolve();
  var dirty = false;
  var lastLocalMutation = 0;

  var MOODS = {
    work:   { label: '工作吐槽', emoji: '😤', tint: 'var(--tint-work)' },
    life:   { label: '生活瑣事', emoji: '🌙', tint: 'var(--tint-life)' },
    values: { label: '人生觀', emoji: '🌱', tint: 'var(--tint-values)' },

  var grid = document.getElementById('boxGrid');

  var noteImage = document.getElementById('noteImage');

  var currentGameEventId = '';

  var gameBusy = false;

  function fmtTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    return d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate() + ' ' +
      String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  function setStatus(msg, isError) {
    statusEl.textContent = msg || '';
    statusEl.classList.toggle('error', !!isError);
  }
  function latestActivity(box) {
    var latest = box.ts || 0;
    (box.replies || []).forEach(function(r){ latest = Math.max(latest, r.ts || 0); });
    return latest;
  }
  function replyChars(box) {
    return (box.replies || []).reduce(function(n,r){ return n + Array.from(r.text || '').length; }, 0);
  }
  function isUnread(box) {
    var readAt = (state.readBy && state.readBy[userId] && state.readBy[userId][box.id]) || 0;
    return latestActivity(box) > readAt;
  }
  function sortedBoxes() {
    return state.boxes.slice().sort(function(a,b){
      var ca = replyChars(a), cb = replyChars(b);
      if (cb !== ca) return cb - ca;
      return latestActivity(b) - latestActivity(a);
    });
  }
  function renderLastOpened() {
    if (userId === 'A' && state.lastOpenedAt) {
      lastOpenedEl.style.display = '';
      lastOpenedEl.textContent = '最近一次有盒子被拆開：' + fmtTime(state.lastOpenedAt);
    } else {
      lastOpenedEl.style.display = 'none';
      lastOpenedEl.textContent = '';
    }
  }
  function renderPingStatus() {
    // Yun（使用者 B）不顯示「最近一次點了我在線上，聊聊？」時間；只有 A 可見。
    if (userId === 'A' && state.onlinePingAt) {
      pingStatusEl.style.display = '';

      } else {
        var swipeSpeed = Math.max(-700, Math.min(700, dx / (elapsed/1000)));
        petState.vx = swipeSpeed || (dx >= 0 ? 180 : -180);
        if (petState.swipeCount >= 2) triggerZoomies();
        else choosePetTarget();
      }
      try{ petActor.releasePointerCapture(e.pointerId); }catch(_){ }
    });
    petActor.addEventListener('pointercancel', function(){ petState.dragging=false; choosePetTarget(); });
    petActor.addEventListener('keydown', function(e){
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); var mode=petModes[Math.floor(Math.random()*petModes.length)]; var moods={rub:'來蹭一下',belly:'翻肚給你看',grin:'嘿嘿',flip:'後空翻！'}; playPetMode(mode,moods[mode]); }
    });
    petState.roamTimer = setInterval(function(){
      if (petState.dragging || !gameOverlay.classList.contains('hidden')) return;
      if (Math.random() < .75) choosePetTarget();
      else if (Math.random() < .5) playPetMode('rub','小雲自己跑來蹭一下');
    }, 3800);
    petState.trickTimer = setInterval(function(){
      if (petState.dragging || !gameOverlay.classList.contains('hidden')) return;
      var r = Math.random();
      if (r < .28) playPetMode('rub','小雲突然跑來蹭你');
      else if (r < .48) playPetMode('belly','小雲翻肚躺一下');
      else if (r < .66) playPetMode('grin','小雲偷偷露牙');
      else if (r < .78) playPetMode('flip','小雲突然後空翻');
    }, 11000);
    requestAnimationFrame(petTick);
  }

  function hideGameEvent() {
    gameOverlay.classList.add('hidden');
    currentGameEventId = '';
  }

  function eventEmoji(type) {
    return ({guess:'🔎', truth:'💬', dare:'🎲', topic:'💡', memory:'🌙', cat:'🐱'})[type] || '🐱';
  }
  function eventLabel(type) {
    return ({guess:'小雲發現一個線索', truth:'小雲想問你一件事', dare:'小雲說：來玩一個小挑戰', topic:'小雲想到一個可以聊的', memory:'小雲記得一件事', cat:'小雲突然來撒嬌'})[type] || '小雲有個小遊戲';
  }
  function renderGameEvent() {
    var ev = state.game && state.game.activeEvent;
    if (!ev || !ev.id) {
      hideGameEvent();
      return;
    }
    var dismissed = Array.isArray(ev.dismissedBy) && ev.dismissedBy.indexOf(userId) >= 0;
    if (ev.completedAt || dismissed) {
      if (currentGameEventId === ev.id) hideGameEvent();
      return;
    }
    var newEvent = currentGameEventId !== ev.id;
    currentGameEventId = ev.id;
    gameMascot.textContent = eventEmoji(ev.type);
    if (newEvent && ev.type === 'cat') playPetMode('rub', '小雲跑來蹭你一下');
    gameEyebrow.textContent = eventLabel(ev.type);
    gameTitle.textContent = ev.title || '玩一個小遊戲';
    gamePrompt.textContent = ev.prompt || '';
    gameChoices.innerHTML = '';
    gameActionRow.innerHTML = '';
    gameReward.textContent = '';
    var choices = Array.isArray(ev.choices) ? ev.choices : [];
    if ((ev.type === 'guess' || ev.type === 'memory') && choices.length) {
      choices.slice(0,2).forEach(function(choice, idx){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'gameChoice'; b.textContent = choice;
        b.addEventListener('click', function(){ submitGameAction('choice', idx); });
        gameChoices.appendChild(b);
      });
    } else {
      var b = document.createElement('button');
      b.type='button'; b.className='gameAction';
      if (ev.type === 'topic') b.textContent = '帶入這個話題';
      else if (ev.type === 'dare') b.textContent = '完成挑戰';
      else if (ev.type === 'truth') b.textContent = '我來回答';
      else b.textContent = '摸摸小雲';
      b.addEventListener('click', function(){ submitGameAction('complete', null); });
      gameActionRow.appendChild(b);
    }
    if (gameOverlay.classList.contains('hidden')) gameOverlay.classList.remove('hidden');
  }

  async function checkAIEvent(boxId, replyId) {
    if (gameBusy) return;
    if (!accessCode || !boxId) return;
    var box = state.boxes.find(function(b){ return b.id === boxId; });
    if (!box || !Array.isArray(box.replies) || !box.replies.length) return;
    var latest = box.replies[box.replies.length - 1];
    if (replyId && latest.id !== replyId) return;
    if (!latest.id || seenReplyIds[latest.id]) return;
    var latestText = String(latest.text || '').trim();
    if (latestText.length < 2 && !/[?？!！。~～😂🤣😆]/u.test(latestText)) return;
    seenReplyIds[latest.id] = true;
    try {
      var res = await fetch(API + '/api/ai-event', {
        method:'POST',
        headers:{'Content-Type':'application/json','X-Access-Code':accessCode},
        body:JSON.stringify({boxId:boxId, replyId:latest.id})
      });
      var result = await res.json().catch(function(){ return {}; });
      if (result && result.game) {
        state.game = result.game;
        renderPet();
      }
      if (result && result.event) {
        state.game = state.game || {};
        state.game.activeEvent = result.event;
        renderGameEvent();
      }
    } catch (_) {}
  }

  async function submitGameAction(action, value) {
    if (gameBusy) return;
    var ev = state.game && state.game.activeEvent;
    if (!ev || !ev.id) return;
    gameBusy = true;
    gameChoices.querySelectorAll('button').forEach(function(b){b.disabled=true;});
    gameActionRow.querySelectorAll('button').forEach(function(b){b.disabled=true;});
    try {
      var res = await fetch(API + '/api/game-action', {
        method:'POST',
        headers:{'Content-Type':'application/json','X-Access-Code':accessCode},
        body:JSON.stringify({eventId:ev.id, action:action, value:value})
      });
      var result = await res.json().catch(function(){ return {}; });
      if (!res.ok || !result.ok) throw new Error(result.error || '遊戲處理失敗');
      if (ev.type === 'topic' && action === 'complete' && ev.prompt) {
        textInput.value = ev.prompt;
        textInput.focus();
      }
      state.game = result.game || state.game;
      renderPet();
      gameReward.textContent = result.message || '';
      setStatus(result.message || '遊戲完成');
      setTimeout(function(){
        if (result.game) renderGameEvent(); else hideGameEvent();
      }, 500);
      render();
    } catch (err) {
      gameReward.textContent = err.message || '遊戲暫時無法更新';
      gameChoices.querySelectorAll('button').forEach(function(b){b.disabled=false;});
      gameActionRow.querySelectorAll('button').forEach(function(b){b.disabled=false;});
    } finally {
      gameBusy = false;
    }
  }

  async function startGameManually() {
    if (gameBusy || !accessCode) return;
    var active = state.game && state.game.activeEvent;
    if (active && active.id && !active.completedAt) {
      renderGameEvent();
      setStatus('現在已經有一個小遊戲在進行。');
      return;
    }
    var candidates = state.boxes.slice().sort(function(a,b){ return latestActivity(b) - latestActivity(a); });
    var box = candidates.find(function(b){ return Array.isArray(b.replies) && b.replies.length; }) || candidates[0];
    if (!box) { setStatus('先放進一個盲盒，再來玩遊戲。', true); return; }
    gameBusy = true;
    startGameBtn.disabled = true;
    startGameBtn.textContent = '🎲 AI 正在想…';
    try {
      var latest = Array.isArray(box.replies) && box.replies.length ? box.replies[box.replies.length - 1] : null;
      var res = await fetch(API + '/api/ai-event', {
        method:'POST',
        headers:{'Content-Type':'application/json','X-Access-Code':accessCode},
        body:JSON.stringify({boxId:box.id, replyId:latest ? latest.id : '', manual:true})
      });
      var result = await res.json().catch(function(){ return {}; });
      if (!res.ok) throw new Error(result.error || '遊戲啟動失敗');
      if (result.game) state.game = result.game;
      if (result.event) {
        state.game = state.game || {};
        state.game.activeEvent = result.event;
        renderGameEvent();
        setStatus('小雲幫你們開了一局。');
      } else {
        renderPet();
        setStatus(result.reason || 'AI 暫時沒有想到適合的玩法。');
      }
    } catch (err) {
      setStatus(err.message || '遊戲啟動失敗', true);
    } finally {
      gameBusy = false;
      startGameBtn.disabled = false;
      startGameBtn.textContent = '🎲 發起遊戲';
    }
  }

  async function skipGameEvent() {
    var ev = state.game && state.game.activeEvent;
    if (!ev || !ev.id || gameBusy) return;
    gameBusy = true;
    try {
      var res = await fetch(API + '/api/game-action', {
        method:'POST', headers:{'Content-Type':'application/json','X-Access-Code':accessCode},
        body:JSON.stringify({eventId:ev.id, action:'dismiss'})
      });
      var result = await res.json().catch(function(){ return {}; });
      if (result && result.game) state.game = result.game;
      hideGameEvent();
      renderPet();
    } catch (_) { hideGameEvent(); }
    finally { gameBusy = false; }
  }
  gameCloseBtn.addEventListener('click', skipGameEvent);
  gameSkipBtn.addEventListener('click', skipGameEvent);

  async function generateAITopic() {
    if (aiTopicBusy) return;
    aiTopicBusy = true;
    aiTopicBtn.disabled = true;
    aiTopicHint.textContent = 'AI 正在根據最近的聊天內容想話題…';
    try {
      var res = await fetch(API + '/api/ai-topic', {
        method: 'POST',
        headers: {'Content-Type':'application/json','X-Access-Code':accessCode},
        body: JSON.stringify({})
      });
      var result = await res.json().catch(function(){ return {}; });
      if (!res.ok || !result.ok || !result.topic) {
        throw new Error(result.error || 'AI 話題生成失敗（HTTP ' + res.status + '）');
      }
      aiTopicValue = String(result.topic).trim();
      aiTopicHint.textContent = aiTopicValue;
      aiTopicUseBtn.style.display = '';
    } catch (err) {
      aiTopicHint.textContent = err.message || 'AI 話題生成失敗';
      aiTopicUseBtn.style.display = 'none';
    } finally {
      aiTopicBtn.disabled = false;
      aiTopicBusy = false;
    }
  }

  async function generateAICover(box) {
    if (!box) return null;
    var res = await fetch(API + '/api/ai-cover', {
      method: 'POST',
      headers: {'Content-Type':'application/json','X-Access-Code':accessCode},
      body: JSON.stringify({ boxId: box.id })
    });
    var result = await res.json().catch(function(){ return {}; });
    if (!res.ok || !result.ok) throw new Error(result.error || 'AI 封面生成失敗（HTTP ' + res.status + '）');
    box.aiTitle = result.title || result.summary || '';
    box.aiTheme = result.theme || '';
    box.aiSummary = result.summary || result.title || '';
    box.aiCoverFileId = null;
    box.aiReplyCount = (box.replies || []).length;
    return result;
  }
  async function refreshAICover(box, showStatus) {
    if (!box || aiBusy) return;
    aiBusy = true;
    aiRefreshBtn.disabled = true;
    try {
      if (showStatus !== false) setStatus('AI 正在分析這個盒子的聊天內容…');
      await generateAICover(box);
      render();
      renderAiCover(box);
      mutate();
      setStatus('AI 封面文字與主題已更新');
    } catch (err) {
      setStatus(err.message || 'AI 封面生成失敗', true);
    } finally {
      aiRefreshBtn.disabled = false;
      aiBusy = false;
    }
  }

  async function ensureMissingAICovers() {
    // 只補尚未有「對話摘要」的盒子，避免每次重新整理都消耗 Gemini 配額。
    var missing = state.boxes.filter(function(box){
      return !(String(box.aiSummary || '').trim() || String(box.aiTitle || '').trim());
    });
    for (var i = 0; i < missing.length && i < MAX_BOXES; i++) {
      await refreshAICover(missing[i], false);
    }
  }

  async function submitReply() {
    if (!openBoxId) return;
    var text = replyInput.value.trim();
    var file = replyImageInput.files && replyImageInput.files[0];
    if (!text && !file) return;
    var box = state.boxes.find(function(b){return b.id === openBoxId;});
    if (!box) return;
    sendReplyBtn.disabled = true;
    try {
      setStatus('正在上傳回覆…');
      var imageFileId = file ? await uploadImage(file) : null;
      box.replies = box.replies || [];
      box.replies.push({
        id: 'r' + Date.now() + Math.random().toString(16).slice(2,6),
        text: text, imageFileId: imageFileId, ts: Date.now(), by: userId,
        replyTo: replyingTo ? Object.assign({}, replyingTo) : null
      });
      replyInput.value = '';
      replyImageInput.value = '';
      replyImageName.textContent = '';
      renderReplies(box);
      setReplyQuote(null);
      state.readBy[userId][box.id] = Date.now();
      var replySavePromise = mutate();
      setStatus('回覆已送出');
      replySavePromise.then(function(saved){
        if (saved) setTimeout(function(){ checkAIEvent(box.id, box.replies[box.replies.length - 1].id); }, 80);
      });
      if ((box.replies || []).length - (box.aiReplyCount || 0) >= 5) {
        replySavePromise.then(function(saved){
          if (saved) setTimeout(function(){ refreshAICover(box, false); }, 50);
        });
      }
    } catch (err) {
      setStatus(err.message || '圖片上傳失敗', true);
    } finally {
      sendReplyBtn.disabled = false;
    }
  }
  sendReplyBtn.addEventListener('click', submitReply);
  replyInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){e.preventDefault();submitReply();}
  });
  replyImageInput.addEventListener('change', function(){
    replyImageName.textContent = replyImageInput.files[0] ? replyImageInput.files[0].name : '';
  });
  boxImageInput.addEventListener('change', function(){
    boxImageName.textContent = boxImageInput.files[0] ? boxImageInput.files[0].name : '';
  });

  aiTopicBtn.addEventListener('click', generateAITopic);
  startGameBtn.addEventListener('click', startGameManually);
  aiTopicUseBtn.addEventListener('click', function(){
    if (!aiTopicValue) return;
    if (!textInput.value.trim()) {
      textInput.value = aiTopicValue;
    } else {
      textInput.value += (textInput.value.endsWith(' ') ? '' : ' ') + aiTopicValue;
    }
    textInput.focus();
    aiTopicUseBtn.style.display = 'none';
  });

  pingBtn.addEventListener('click', function(){
    state.onlinePingAt = Date.now();
    pingBtn.classList.add('sent');
    setTimeout(function(){pingBtn.classList.remove('sent');},1200);
    mutate();
    setStatus('已送出上線訊號');
  });

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    var text = textInput.value.trim();
    var file = boxImageInput.files && boxImageInput.files[0];
    if (!text && !file) { setStatus('請輸入文字或附上一張圖片。', true); return; }
    if (state.boxes.length >= MAX_BOXES) {
      setStatus('目前最多 5 個盒子，請先刪除一個。', true);
      return;
    }
    submitBtn.disabled = true;
    try {
      setStatus(file ? '正在上傳圖片…' : '正在建立盲盒…');
      var imageFileId = file ? await uploadImage(file) : null;
      var checked = form.querySelector('input[name="mood"]:checked');
      var newBox = {
        id:'b'+Date.now()+Math.random().toString(16).slice(2,6),
        text:text, imageFileId:imageFileId, mood:checked ? checked.value : 'life',
        ts:Date.now(), replies:[], aiReplyCount:0
      };
      state.boxes.push(newBox);
      textInput.value = '';
      boxImageInput.value = '';
      boxImageName.textContent = '';
      var savedNewBox = await mutate();
      setStatus(savedNewBox ? '盲盒已建立，AI 正在分析主題…' : '盲盒已建立，正在等待同步…');
      if (savedNewBox) {
        try {
          await refreshAICover(newBox, false);
        } catch (_) {}
      }
    } catch (err) {
      setStatus(err.message || '建立盲盒失敗', true);
    } finally {
      submitBtn.disabled = false;
    }
  });

  function normalizeState(s) {
    s = s && typeof s === 'object' ? s : {};
    s.boxes = Array.isArray(s.boxes) ? s.boxes : [];
    s.boxes.forEach(function(b){
      if(!Array.isArray(b.replies)) b.replies = [];
      b.aiTitle = b.aiTitle || '';
      b.aiTheme = b.aiTheme || '';
      b.aiSummary = b.aiSummary || '';
      b.aiCoverFileId = null;
      b.aiReplyCount = Number.isFinite(b.aiReplyCount) ? b.aiReplyCount : (b.replies.length ? 0 : 0);
      b.replies.forEach(function(r){ r.replyTo = r.replyTo || null; });
    });
    s.readBy = s.readBy && typeof s.readBy === 'object' ? s.readBy : {};
    s.lastOpenedAt = s.lastOpenedAt || null;
    s.onlinePingAt = s.onlinePingAt || null;
    s.game = s.game && typeof s.game === 'object' ? s.game : {
      xp: 0, level: 1, achievements: [], pet: { name: '小雲', xp: 0, level: 1, mood: '今天心情不錯' }, activeEvent: null, history: []
    };
    s.game.achievements = Array.isArray(s.game.achievements) ? s.game.achievements : [];
    s.game.history = Array.isArray(s.game.history) ? s.game.history : [];
    s.game.pet = s.game.pet && typeof s.game.pet === 'object' ? s.game.pet : { name: '小雲', xp: 0, level: 1, mood: '今天心情不錯' };
    return s;
  }
  function loadState() {
    return fetch(API + '/api/state', {
      headers: {'X-Access-Code':accessCode}
    }).then(function(res){
      if(res.status === 401) throw new Error('通行碼錯誤，請重新整理並輸入正確通行碼。');
      if(!res.ok) throw new Error('讀取失敗（HTTP ' + res.status + '）');
      return res.json();
    }).then(function(payload){
      userId = payload.user;
      state = normalizeState(payload.state);
      render();
      setStatus('');
      // 僅在通行碼驗證成功、雲端資料載入成功後發送 Telegram 通知
      notifyVisit();
    });
  }
  function notifyVisit() {
    fetch(API + '/api/visit', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({event:'盲盒網站登入成功｜使用者：' + (userId === 'A' ? 'A' : userId === 'B' ? 'B' : userId)}),
      keepalive:true
    }).catch(function(){});
  }

  if (!accessCode) {
    accessCode = window.prompt('請輸入你的盲盒信箱通行碼（由信箱建立者提供）') || '';
  }
  if (!accessCode) {
    setStatus('尚未輸入通行碼。重新整理頁面即可再試。', true);
    form.querySelectorAll('input,textarea,button').forEach(function(el){el.disabled=true;});
    return;
  }
  sessionStorage.setItem('blindbox_access_code', accessCode);

  loadState().then(function(){
    // 先顯示盒子，再補齊舊盒子的 AI 對話摘要封面。
    window.setTimeout(function(){
      ensureMissingAICovers().catch(function(){});
      state.boxes.forEach(function(b){
        if (b.replies && b.replies.length) checkAIEvent(b.id, b.replies[b.replies.length - 1].id);
      });
    }, 150);
    window.setInterval(function(){
      if (dirty || Date.now() - lastLocalMutation < 2500) return;
      fetch(API + '/api/state', {
        headers:{'X-Access-Code':accessCode}
      }).then(function(res){
        if(!res.ok) return;
        return res.json();
      }).then(function(payload){
        if(!payload || dirty) return;
        state = normalizeState(payload.state);
        render();
        state.boxes.forEach(function(b){
          if (b.replies && b.replies.length) checkAIEvent(b.id, b.replies[b.replies.length - 1].id);
        });
        if(openBoxId) {
          var current = state.boxes.find(function(b){return b.id === openBoxId;});
          if(current) {
            noteText.textContent = current.text || '';
            noteImage.style.display = current.imageFileId ? 'block' : 'none';
            noteImage.src = current.imageFileId ? API + '/api/image?file_id=' + encodeURIComponent(current.imageFileId) : '';
            renderReplies(current);
            renderAiCover(current);
          } else closeNote();
        }
      }).catch(function(){});
    }, POLL_MS);
  }).catch(function(err){
    sessionStorage.removeItem('blindbox_access_code');
    setStatus(err.message || '無法連接雲端 API。', true);
    window.alert(err.message || '無法連接雲端 API。請確認 Worker 已部署。');
  });
})();
</script>
