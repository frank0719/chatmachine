<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light" style="color-scheme: light;"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>盲盒信箱</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #06070C;
    --glass: rgba(255,255,255,.09);
    --glass-strong: rgba(255,255,255,.16);
    --glass-border: rgba(255,255,255,.28);
    --glass-shadow: 0 8px 32px rgba(0,0,0,.45);
    --tint-work: #F2C572;
    --tint-life: #B9AEF0;
    --tint-values: #7FE0CF;
    --tint-random: #F0A6C0;
    --tint-share: #4CE0FF;
    --accent-cyan: #4CE0FF;
    --accent-cyan-dim: rgba(76,224,255,.4);
    --text-hi: #F7F7FB;
    --text-lo: rgba(247,247,251,.62);
    --danger: #FF8A8A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg-base);
    color: var(--text-hi);
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif;
    overflow-x: hidden;
  }
  body {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .mesh {
    position: fixed;
    inset: -10%;
    z-index: 0;
    filter: blur(70px);
    background:
      radial-gradient(38% 32% at 18% 22%, rgba(99,102,241,.55), transparent 70%),
      radial-gradient(34% 30% at 82% 18%, rgba(236,72,153,.42), transparent 70%),
      radial-gradient(40% 36% at 70% 78%, rgba(45,212,191,.38), transparent 70%),
      radial-gradient(30% 28% at 20% 82%, rgba(234,179,8,.28), transparent 70%);
    animation: drift 26s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0%   { transform: translate3d(0,0,0) scale(1); }
    100% { transform: translate3d(2%,-3%,0) scale(1.06); }
  }
  @media (prefers-reduced-motion: reduce) {
    .mesh { animation: none; }
  }
  main {
    position: relative;
    z-index: 1;
    max-width: 560px;
    margin: 0 auto;
    padding: 44px 20px 40px;
  }
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  .statusLine {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 11.5px;
    letter-spacing: .02em;
    color: var(--accent-cyan);
    margin-bottom: 14px;
  }
  .statusLine .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent-cyan);
    box-shadow: 0 0 8px 2px var(--accent-cyan-dim);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: .5; transform: scale(.85); }
    50% { opacity: 1; transform: scale(1.1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .statusLine .dot { animation: none; }
  }
  h1 {
    font-weight: 800;
    font-size: clamp(26px, 6vw, 32px);
    margin: 0 0 10px;
    letter-spacing: -.01em;
  }
  header p {
    color: var(--text-lo);
    font-size: 14.5px;
    line-height: 1.7;
    max-width: 32em;
    margin: 0 auto;
  }
  .lastOpened {
    display: inline-block;
    margin-top: 14px;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    color: var(--text-hi);
    background: var(--glass);
    border: 1px solid var(--glass-border);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
  }
  .pingRow {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
  }
  .pingBtn {
    appearance: none;
    border: 1px solid var(--glass-border);
    background: var(--glass);
    color: var(--text-hi);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    backdrop-filter: blur(18px) saturate(160%);
    box-shadow: var(--glass-shadow);
    font-family: inherit;
    font-weight: 600;
    font-size: 13.5px;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .15s ease, background .15s ease;
  }
  .pingBtn:hover { transform: translateY(-1px); background: var(--glass-strong); }
  .pingBtn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .pingBtn.sent { opacity: .7; }
  .pingStatus {
    font-size: 12px;
    color: var(--text-lo);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(142px, 1fr));
    gap: 14px;
    margin-bottom: 28px;
  }
  .emptyHint {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--text-lo);
    font-size: 14px;
    padding: 24px 0;
  }
  .box {
    appearance: none;
    border: 1px solid var(--glass-border);
    aspect-ratio: 0.86;
    min-height: 150px;
    border-radius: 22px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    backdrop-filter: blur(18px) saturate(160%);
    box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.25);
    position: relative;
    cursor: pointer;
    padding: 0;
    transition: transform .18s ease, background .18s ease;
    overflow: hidden;
  }
  .box::before {
    content: '';
    position: absolute;
    inset: -30%;
    background: radial-gradient(circle at 50% 30%, var(--tint), transparent 65%);
    opacity: .5;
  }
  .box:hover { transform: translateY(-2px); background: var(--glass-strong); box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.25), 0 0 0 1px var(--accent-cyan-dim), 0 0 18px var(--accent-cyan-dim); }
  .box:focus-visible { outline: 2px solid var(--accent-cyan); outline-offset: 3px; }
  .box .badge {
    position: absolute;
    top: 6px; right: 6px;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 999px;
    background: rgba(0,0,0,.35);
    border: 1px solid var(--glass-border);
    font-size: 10.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  .box .peek {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    z-index: 1;
  }
  .box.aiCover {
    background: linear-gradient(145deg, rgba(76,224,255,.16), rgba(146,123,255,.14) 52%, rgba(255,166,200,.16));
  }
  .box.aiCover::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.22));
    z-index: 0;
  }
  .boxCoverIcon {
    position: absolute;
    left: 50%;
    top: 34%;
    transform: translate(-50%,-50%);
    font-size: 26px;
    opacity: .9;
    z-index: 1;
  }
  .boxCoverTitle {
    position: absolute;
    left: 12px;
    right: 12px;
    top: 62px;
    color: #fff;
    font-size: 15px;
    line-height: 1.5;
    font-weight: 800;
    text-align: center;
    text-shadow: 0 1px 8px rgba(0,0,0,.6);
    z-index: 2;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    overflow-wrap: anywhere;
  }
  .boxCoverTheme { display: none; }
  .boxCoverSummary { display: none; }
  #aiCoverTheme { display: none; }
  #aiCoverSummary { display: none; }
  .box.opened { opacity: .85; }
  .box.bounce { animation: bounce .38s ease; }
  @keyframes bounce {
    0% { transform: scale(1); }
    35% { transform: scale(.92) rotate(-2deg); }
    65% { transform: scale(1.06) rotate(2deg); }
    100% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .box.bounce { animation: none; }
    .box, .overlay, .note { transition: none !important; }
  }
  form {
    position: relative;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    backdrop-filter: blur(22px) saturate(160%);
    box-shadow: var(--glass-shadow);
    border-radius: 26px;
    padding: 20px;
    isolation: isolate;
  }
  form::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: inherit;
    padding: 1px;
    background: conic-gradient(from var(--angle, 0deg), var(--accent-cyan-dim), transparent 30%, transparent 70%, var(--accent-cyan-dim));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    z-index: -1;
    animation: rotateAngle 6s linear infinite;
  }
  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }
  @keyframes rotateAngle {
    to { --angle: 360deg; }
  }
  @media (prefers-reduced-motion: reduce) {
    form::before { animation: none; }
  }
  .moods {
    display: flex;
    flex-wrap: nowrap;
    gap: 6px;
    margin-bottom: 14px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .moods::-webkit-scrollbar { display: none; }
  .moods label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 7px 10px;
    flex: 0 0 auto;
    white-space: nowrap;
    border-radius: 999px;
    border: 1px solid var(--glass-border);
    background: rgba(255,255,255,.04);
    font-size: 13px;
    color: var(--text-lo);
    cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
  }
  .moods input { position: absolute; opacity: 0; pointer-events: none; }
  .moods label:has(input:checked) { border-color: #fff; color: var(--text-hi); background: rgba(255,255,255,.14); }
  textarea, .replyInput {
    width: 100%;
    background: rgba(0,0,0,.22);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    color: var(--text-hi);
    font-family: inherit;
    font-size: 15px;
    padding: 12px 14px;
    line-height: 1.6;
  }
  .topicRow {
    display:flex;
    align-items:center;
    gap:8px;
    margin: 0 0 8px;
    min-width:0;
  }
  .aiTopicBtn, .aiTopicUseBtn {
    appearance:none;
    border:1px solid rgba(76,224,255,.35);
    background:rgba(76,224,255,.07);
    color:var(--text-hi);
    border-radius:10px;
    font-family:inherit;
    font-size:12px;
    padding:7px 10px;
    cursor:pointer;
    flex:none;
  }
  .aiTopicBtn:hover, .aiTopicUseBtn:hover { background:rgba(76,224,255,.13); }
  .aiTopicBtn:disabled { opacity:.55; cursor:wait; }
  .aiTopicHint {
    color:var(--text-lo);
    font-size:11.5px;
    line-height:1.45;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    flex:1;
  }
  textarea { min-height: 84px; resize: vertical; }
  textarea:focus-visible, .replyInput:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  textarea::placeholder, .replyInput::placeholder { color: rgba(247,247,251,.4); }
  .formFooter {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 14px;
  }
  button.submit, button.sendReply {
    appearance: none;
    border: none;
    background: rgba(255,255,255,.92);
    color: #10121A;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    padding: 11px 20px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .15s ease, opacity .15s ease;
  }
  button.submit:hover, button.sendReply:hover { transform: translateY(-1px); }
  button.submit:focus-visible, button.sendReply:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  #status { font-size: 12.5px; color: var(--text-lo); }
  #status.error { color: var(--danger); }
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 5;
    background: rgba(4,4,8,.55);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 1;
    transition: opacity .18s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .note {
    position: relative;
    isolation: isolate;
    max-width: 440px;
    width: 100%;
    max-height: 82vh;
    display: flex;
    flex-direction: column;
    background: rgba(24,22,36,.55);
    border: 1px solid var(--glass-border);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    backdrop-filter: blur(28px) saturate(180%);
    border-radius: 28px;
    padding: 22px 20px 18px;
    box-shadow: 0 24px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.15);
    transform: scale(1);
    transition: transform .18s ease;
  }
  .note::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: inherit;
    padding: 1px;
    background: conic-gradient(from var(--angle, 0deg), var(--accent-cyan-dim), transparent 30%, transparent 70%, var(--accent-cyan-dim));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    z-index: -1;
    animation: rotateAngle 6s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .note::before { animation: none; }
  }
  .overlay.hidden .note { transform: scale(.94); }
  .noteTop {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  #noteMeta { font-size: 12.5px; font-family: ui-monospace, 'SF Mono', Menlo, monospace; color: var(--accent-cyan); margin: 0; flex: 1; }
  .iconBtn {
    appearance: none;
    border: 1px solid var(--glass-border);
    background: rgba(255,255,255,.06);
    color: var(--text-hi);
    width: 30px; height: 30px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex: none;
  }
  .iconBtn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .iconBtn.danger { color: var(--danger); border-color: rgba(255,138,138,.4); }
  .iconBtn.danger.confirming { background: rgba(255,138,138,.18); }
  #noteText {
    font-size: 16.5px;
    line-height: 1.85;
    white-space: pre-wrap;
    margin: 0 0 8px;
  }
  .noteActionRow {
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin: 0 0 12px;
  }
  .quoteBtn, .aiBtn, .cancelQuoteBtn {
    appearance:none;
    border:1px solid var(--glass-border);
    background:rgba(255,255,255,.06);
    color:var(--text-hi);
    border-radius:10px;
    font-family:inherit;
    font-size:12px;
    padding:7px 10px;
    cursor:pointer;
  }
  .aiBtn { border-color:rgba(76,224,255,.35); }
  .quoteBtn:hover, .aiBtn:hover, .cancelQuoteBtn:hover { background:rgba(255,255,255,.12); }
  .aiCoverPanel {
    display:none;
    margin: 0 0 14px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:16px;
    overflow:hidden;
    background:rgba(0,0,0,.12);
  }
  .aiCoverPanel.show { display:block; }
  .aiCoverInfo { padding:10px 12px 12px; }
  .aiCoverTitle { font-weight:800; font-size:16px; }
  .aiCoverTheme { font-size:12px; color:var(--accent-cyan); margin-top:4px; }
  .aiCoverSummary { font-size:13px; line-height:1.6; color:var(--text-lo); margin-top:7px; }
  .quoteComposer {
    display:none;
    margin: 0 0 8px;
    padding: 8px 10px;
    border-left: 3px solid var(--accent-cyan);
    border-radius: 9px;
    background: rgba(76,224,255,.08);
  }
  .quoteComposer.show { display:block; }
  .quoteComposerTop { display:flex; justify-content:space-between; gap:8px; align-items:center; font-size:11px; color:var(--accent-cyan); }
  .quoteComposerText { margin-top:4px; font-size:12px; color:var(--text-lo); white-space:pre-wrap; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; }
  .replyHeader {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:4px;
  }
  .replyHeader button { font-size:11px; padding:4px 7px; }
  .replyQuote {
    border-left: 3px solid rgba(76,224,255,.6);
    background: rgba(76,224,255,.06);
    border-radius: 8px;
    padding: 6px 8px;
    margin: 0 0 7px;
    color: var(--text-lo);
    font-size: 12px;
  }
  .replyQuoteLabel { color: var(--accent-cyan); font-size:10px; margin-bottom:2px; font-weight:700; }
  .replies {
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
    padding-right: 2px;
  }
  .reply {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 14px;
    padding: 9px 12px;
    font-size: 14px;
    line-height: 1.55;
  }
  .replyRow {
    display: flex;
    gap: 8px;
  }
  button.sendReply { padding: 0 18px; flex: none; }
  .imagePickRow { display:flex; align-items:center; gap:10px; margin:10px 0 14px; flex-wrap:wrap; }
  .imagePick { display:inline-flex; align-items:center; border:1px solid var(--glass-border); background:var(--glass); color:var(--text-hi); padding:8px 12px; border-radius:12px; font-size:13px; cursor:pointer; }
  .imageName { color:var(--text-lo); font-size:12px; overflow-wrap:anywhere; }
  .attachedImage { display:block; max-width:100%; max-height:420px; object-fit:contain; border-radius:12px; margin:10px 0; }
  .replyImageRow { margin-top:8px; }
</style>
</head>
<body>
<div class="mesh"></div>
<main>
  <header>
    <div class="statusLine"><span class="dot"></span>私人頻道 · 連線中</div>
    <h1>盲盒信箱</h1>
    <p>想到什麼就先包起來,不用配合我的時間表——但每個盒子,我都會看。</p>
    <span id="lastOpened" class="lastOpened" style="display:none;"></span>
    <div class="pingRow">
      <button id="pingBtn" type="button" class="pingBtn">💬 我在線上,聊聊?</button>
      <span id="pingStatus" class="pingStatus" style="display:none;"></span>
    </div>
  </header>

  <section id="boxGrid" class="grid"></section>

  <form id="addForm">
    <div class="moods">
      <label><input type="radio" name="mood" value="work"><span>😤 工作吐槽</span></label>
      <label><input type="radio" name="mood" value="life" checked=""><span>🌙 生活瑣事</span></label>
      <label><input type="radio" name="mood" value="values"><span>🌱 人生觀</span></label>
      <label><input type="radio" name="mood" value="share"><span>🌤️ 開心分享</span></label>
      <label><input type="radio" name="mood" value="random"><span>🎲 隨便說說</span></label>
    </div>
    <div class="topicRow">
      <button id="aiTopicBtn" type="button" class="aiTopicBtn">✦ AI 想話題</button>
      <span id="aiTopicHint" class="aiTopicHint">讓 AI 根據最近的聊天內容想一個自然的開場</span>
      <button id="aiTopicUseBtn" type="button" class="aiTopicUseBtn" style="display:none;">帶入</button>
    </div>
    <textarea id="boxText" placeholder="寫下你想說的話,或問問她今天有什麼開心事、想不想傳張照片……"></textarea>
    <div class="imagePickRow">
      <label class="imagePick">📷 附上一張圖片<input id="boxImageInput" type="file" accept="image/*" hidden></label>
      <span id="boxImageName" class="imageName"></span>
    </div>
    <div class="formFooter">
      <span id="status"></span>
      <button type="submit" class="submit">包起來,放進去 🎁</button>
    </div>
  </form>
</main>

<div id="noteOverlay" class="overlay hidden">
  <div class="note">
    <div class="noteTop">
      <p id="noteMeta"></p>
      <button id="deleteBox" class="iconBtn danger" aria-label="刪除這個盒子" title="刪除">🗑</button>
      <button id="closeNote" class="iconBtn" aria-label="關閉">✕</button>
    </div>
    <p id="noteText"></p>
    <div class="noteActionRow">
      <button id="quoteBoxBtn" type="button" class="quoteBtn">↩ 引用這句</button>
      <button id="aiRefreshBtn" type="button" class="aiBtn">✦ AI 更新摘要</button>
    </div>
    <div id="aiCoverPanel" class="aiCoverPanel">
      <div class="aiCoverInfo">
        <div id="aiCoverTitle" class="aiCoverTitle"></div>
        <div id="aiCoverTheme" class="aiCoverTheme"></div>
        <div id="aiCoverSummary" class="aiCoverSummary"></div>
        <div class="aiCoverSummary" style="margin-top:6px;opacity:.55;">封面以文字呈現，會隨聊天內容自動更新。</div>
      </div>
    </div>
    <img id="noteImage" class="attachedImage" alt="盲盒附圖" style="display:none">
    <div id="repliesList" class="replies"></div>
    <div id="quoteComposer" class="quoteComposer">
      <div class="quoteComposerTop"><span>正在引用</span><button id="cancelQuote" type="button" class="cancelQuoteBtn">取消</button></div>
      <div id="quoteComposerText" class="quoteComposerText"></div>
    </div>
    <div class="replyRow">
      <input id="replyInput" class="replyInput" type="text" placeholder="回這句話……" maxlength="300">
      <button id="sendReply" class="sendReply" type="button">回覆</button>
    </div>
    <div class="imagePickRow replyImageRow">
      <label class="imagePick">📷 附圖回覆<input id="replyImageInput" type="file" accept="image/*" hidden></label>
      <span id="replyImageName" class="imageName"></span>
    </div>
  </div>
</div>

<script id="app-state" type="application/json">{"boxes":[],"lastOpenedAt":null,"readBy":{},"onlinePingAt":null}</script>
<script>
(function(){
  'use strict';

  var API = 'https://yun-online-notice.frank8771919.workers.dev';
  var MAX_BOXES = 5;
  var POLL_MS = 8000;
  var accessCode = sessionStorage.getItem('blindbox_access_code') || '';
  var userId = '';
  var state = { boxes: [], lastOpenedAt: null, readBy: {}, onlinePingAt: null };
  var openBoxId = null;
  var pendingDelete = false;
  var replyingTo = null;
  var aiBusy = false;
  var saveQueue = Promise.resolve();
  var dirty = false;
  var lastLocalMutation = 0;

  var MOODS = {
    work:   { label: '工作吐槽', emoji: '😤', tint: 'var(--tint-work)' },
    life:   { label: '生活瑣事', emoji: '🌙', tint: 'var(--tint-life)' },
    values: { label: '人生觀', emoji: '🌱', tint: 'var(--tint-values)' },
    random: { label: '隨便說說', emoji: '🎲', tint: 'var(--tint-random)' },
    share:  { label: '開心分享', emoji: '🌤️', tint: 'var(--tint-share)' }
  };

  var grid = document.getElementById('boxGrid');
  var form = document.getElementById('addForm');
  var textInput = document.getElementById('boxText');
  var overlay = document.getElementById('noteOverlay');
  var noteMeta = document.getElementById('noteMeta');
  var noteText = document.getElementById('noteText');
  var repliesList = document.getElementById('repliesList');
  var replyInput = document.getElementById('replyInput');
  var sendReplyBtn = document.getElementById('sendReply');
  var noteImage = document.getElementById('noteImage');
  var boxImageInput = document.getElementById('boxImageInput');
  var boxImageName = document.getElementById('boxImageName');
  var replyImageInput = document.getElementById('replyImageInput');
  var replyImageName = document.getElementById('replyImageName');
  var submitBtn = form.querySelector('button[type="submit"]');
  var closeNoteBtn = document.getElementById('closeNote');
  var deleteBtn = document.getElementById('deleteBox');
  var quoteBoxBtn = document.getElementById('quoteBoxBtn');
  var quoteComposer = document.getElementById('quoteComposer');
  var quoteComposerText = document.getElementById('quoteComposerText');
  var cancelQuoteBtn = document.getElementById('cancelQuote');
  var aiRefreshBtn = document.getElementById('aiRefreshBtn');
  var aiCoverPanel = document.getElementById('aiCoverPanel');
  var aiCoverTitle = document.getElementById('aiCoverTitle');
  var aiCoverTheme = document.getElementById('aiCoverTheme');
  var aiCoverSummary = document.getElementById('aiCoverSummary');
  var statusEl = document.getElementById('status');
  var lastOpenedEl = document.getElementById('lastOpened');
  var pingBtn = document.getElementById('pingBtn');
  var pingStatusEl = document.getElementById('pingStatus');
  var aiTopicBtn = document.getElementById('aiTopicBtn');
  var aiTopicHint = document.getElementById('aiTopicHint');
  var aiTopicUseBtn = document.getElementById('aiTopicUseBtn');
  var aiTopicValue = '';
  var aiTopicBusy = false;

  function fmtTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    return d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate() + ' ' +
      String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  function setStatus(msg, isError) {
    statusEl.textContent = msg || '';
    statusEl.classList.toggle('error', !!isError);
  }
  function latestActivity(box) {
    var latest = box.ts || 0;
    (box.replies || []).forEach(function(r){ latest = Math.max(latest, r.ts || 0); });
    return latest;
  }
  function replyChars(box) {
    return (box.replies || []).reduce(function(n,r){ return n + Array.from(r.text || '').length; }, 0);
  }
  function isUnread(box) {
    var readAt = (state.readBy && state.readBy[userId] && state.readBy[userId][box.id]) || 0;
    return latestActivity(box) > readAt;
  }
  function sortedBoxes() {
    return state.boxes.slice().sort(function(a,b){
      var ca = replyChars(a), cb = replyChars(b);
      if (cb !== ca) return cb - ca;
      return latestActivity(b) - latestActivity(a);
    });
  }
  function renderLastOpened() {
    if (userId === 'A' && state.lastOpenedAt) {
      lastOpenedEl.style.display = '';
      lastOpenedEl.textContent = '最近一次有盒子被拆開：' + fmtTime(state.lastOpenedAt);
    } else {
      lastOpenedEl.style.display = 'none';
      lastOpenedEl.textContent = '';
    }
  }
  function renderPingStatus() {
    if (state.onlinePingAt) {
      pingStatusEl.style.display = '';
      pingStatusEl.textContent = '最近一次點了「我在線上，聊聊？」：' + fmtTime(state.onlinePingAt);
    } else pingStatusEl.style.display = 'none';
  }
  function render() {
    renderLastOpened();
    renderPingStatus();
    grid.innerHTML = '';
    sortedBoxes().forEach(function(box){
      var mood = MOODS[box.mood] || MOODS.random;
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'box' + (isUnread(box) ? ' unread' : '');
      el.style.setProperty('--tint', mood.tint);
      el.setAttribute('aria-label', mood.label + (isUnread(box) ? '，有未讀內容' : ''));
      var count = (box.replies || []).length;
      var coverTitle = String(box.aiSummary || box.aiTitle || '').trim();
      var coverTheme = String(box.aiTheme || '').trim();
      var coverSummary = '';
      if (coverTitle || coverTheme || coverSummary) el.classList.add('aiCover');
      el.innerHTML =
        (count ? '<span class="badge">' + count + '</span>' : '') +
        (coverTitle ? '' : '<span class="peek">' + escapeHtml(mood.emoji) + '</span>') +
        (coverTitle ? '<span class="boxCoverTitle">' + escapeHtml(coverTitle) + '</span>' : '') +
        (isUnread(box) ? '<span class="unreadDot" title="未讀"></span>' : '');
      el.addEventListener('click', function(){
        el.classList.add('bounce');
        setTimeout(function(){el.classList.remove('bounce');},380);
        openBox(box.id);
      });
      grid.appendChild(el);
    });
    if (!state.boxes.length) {
      var empty = document.createElement('p');
      empty.className = 'emptyHint';
      empty.textContent = '盒子是空的。想到什麼，先包起來。';
      grid.appendChild(empty);
    }
  }
  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function quoteSourceText(source) {
    if (!source) return '';
    var text = source.text || '';
    if (!text && source.imageFileId) text = '圖片';
    return text || '（無文字）';
  }
  function setReplyQuote(target) {
    replyingTo = target || null;
    if (!replyingTo) {
      quoteComposer.classList.remove('show');
      quoteComposerText.textContent = '';
      return;
    }
    quoteComposer.classList.add('show');
    quoteComposerText.textContent = quoteSourceText(replyingTo);
    replyInput.focus();
  }
  function makeQuoteTarget(box, source, type) {
    return {
      type: type || 'reply',
      id: source.id,
      by: source.by || (type === 'box' ? userId : ''),
      text: (source.text || '').slice(0, 500),
      imageFileId: source.imageFileId || null,
      ts: source.ts || Date.now()
    };
  }
  function renderAiCover(box) {
    var hasTextCover = !!(box.aiTitle || box.aiTheme || box.aiSummary);
    aiCoverPanel.classList.toggle('show', hasTextCover);
    aiCoverTitle.textContent = box.aiTitle || '';
    aiCoverTheme.textContent = box.aiTheme ? '主題：' + box.aiTheme : '';
    aiCoverSummary.textContent = box.aiSummary || '';
  }
  function renderReplies(box) {
    repliesList.innerHTML = '';
    (box.replies || []).forEach(function(r){
      var row = document.createElement('div');
      row.className = 'reply';
      var header = document.createElement('div');
      header.className = 'replyHeader';
      var who = document.createElement('div');
      who.style.cssText = 'font-size:11px;opacity:.65;';
      who.textContent = (r.by === 'A' ? 'A' : r.by === 'B' ? 'B' : '成員') + ' · ' + fmtTime(r.ts);
      var quoteBtn = document.createElement('button');
      quoteBtn.type = 'button';
      quoteBtn.className = 'quoteBtn';
      quoteBtn.textContent = '↩ 引用';
      quoteBtn.addEventListener('click', function(){
        setReplyQuote(makeQuoteTarget(box, r, 'reply'));
      });
      header.appendChild(who);
      header.appendChild(quoteBtn);
      row.appendChild(header);
      if (r.replyTo) {
        var quote = document.createElement('div');
        quote.className = 'replyQuote';
        var qlabel = document.createElement('div');
        qlabel.className = 'replyQuoteLabel';
        qlabel.textContent = '引用 ' + (r.replyTo.by === 'A' ? 'A' : r.replyTo.by === 'B' ? 'B' : '訊息');
        var qtext = document.createElement('div');
        qtext.textContent = quoteSourceText(r.replyTo);
        quote.appendChild(qlabel);
        quote.appendChild(qtext);
        row.appendChild(quote);
      }
      if (r.text) {
        var text = document.createElement('div');
        text.style.whiteSpace = 'pre-wrap';
        text.textContent = r.text;
        row.appendChild(text);
      }
      if (r.imageFileId) {
        var img = document.createElement('img');
        img.className = 'attachedImage';
        img.alt = '回覆附圖';
        img.loading = 'lazy';
        img.src = API + '/api/image?file_id=' + encodeURIComponent(r.imageFileId);
        row.appendChild(img);
      }
      repliesList.appendChild(row);
    });
  }
  function resetDeleteConfirm() {
    pendingDelete = false;
    deleteBtn.classList.remove('confirming');
    deleteBtn.textContent = '🗑';
    deleteBtn.title = '刪除';
  }
  function mutate() {
    dirty = true;
    lastLocalMutation = Date.now();
    render();
    return queueSave();
  }
  function queueSave() {
    saveQueue = saveQueue.then(function(){
      if (!dirty) return true;
      var snapshot = JSON.stringify(state);
      dirty = false;
      return fetch(API + '/api/state', {
        method: 'PUT',
        headers: {'Content-Type':'application/json','X-Access-Code':accessCode},
        body: snapshot
      }).then(function(res){
        if (!res.ok) throw new Error('儲存失敗（HTTP ' + res.status + '）');
        setStatus('已同步');
        return true;
      }).catch(function(err){
        dirty = true;
        setStatus(err.message || '同步失敗，請檢查網路後重試。', true);
        return false;
      });
    });
    return saveQueue;
  }
  function openBox(id) {
    openBoxId = id;
    resetDeleteConfirm();
    var box = state.boxes.find(function(b){return b.id === id;});
    if (!box) return;
    var mood = MOODS[box.mood] || MOODS.random;
    noteMeta.textContent = mood.emoji + ' ' + mood.label + (box.ts ? ' · ' + fmtTime(box.ts) : '');
    noteText.textContent = box.text || '';
    noteImage.style.display = box.imageFileId ? 'block' : 'none';
    noteImage.src = box.imageFileId ? API + '/api/image?file_id=' + encodeURIComponent(box.imageFileId) : '';
    renderReplies(box);
    renderAiCover(box);
    setReplyQuote(null);
    replyInput.value = '';
    overlay.classList.remove('hidden');
    state.readBy = state.readBy || {};
    state.readBy[userId] = state.readBy[userId] || {};
    state.readBy[userId][box.id] = Date.now();
    state.lastOpenedAt = Date.now();
    mutate();
  }
  function closeNote() {
    overlay.classList.add('hidden');
    openBoxId = null;
  }
  closeNoteBtn.addEventListener('click', closeNote);
  overlay.addEventListener('click', function(e){ if(e.target === overlay) closeNote(); });

  quoteBoxBtn.addEventListener('click', function(){
    var box = openBoxId && state.boxes.find(function(b){return b.id === openBoxId;});
    if (box) setReplyQuote(makeQuoteTarget(box, box, 'box'));
  });
  cancelQuoteBtn.addEventListener('click', function(){ setReplyQuote(null); });
  aiRefreshBtn.addEventListener('click', function(){
    var box = openBoxId && state.boxes.find(function(b){return b.id === openBoxId;});
    if (box) refreshAICover(box);
  });

  deleteBtn.addEventListener('click', function(){
    if (!openBoxId) return;
    if (!pendingDelete) {
      pendingDelete = true;
      deleteBtn.classList.add('confirming');
      deleteBtn.textContent = '確定?';
      deleteBtn.title = '再按一次確定刪除';
      return;
    }
    state.boxes = state.boxes.filter(function(b){return b.id !== openBoxId;});
    closeNote();
    mutate();
  });

  async function uploadImage(file) {
    if (!file) return null;
    if (!file.type || !file.type.startsWith('image/')) throw new Error('請選擇圖片檔案。');
    if (file.size > 8 * 1024 * 1024) throw new Error('圖片需小於 8 MB，請先壓縮再上傳。');
    var data = new FormData();
    data.append('photo', file, file.name);
    var res = await fetch(API + '/api/upload', {
      method: 'POST',
      headers: {'X-Access-Code': accessCode},
      body: data
    });
    var result = await res.json().catch(function(){ return {}; });
    if (!res.ok || !result.file_id) throw new Error(result.error || '圖片上傳失敗（HTTP ' + res.status + '）');
    return result.file_id;
  }

  async function generateAITopic() {
    if (aiTopicBusy) return;
    aiTopicBusy = true;
    aiTopicBtn.disabled = true;
    aiTopicHint.textContent = 'AI 正在根據最近的聊天內容想話題…';
    try {
      var res = await fetch(API + '/api/ai-topic', {
        method: 'POST',
        headers: {'Content-Type':'application/json','X-Access-Code':accessCode},
        body: JSON.stringify({})
      });
      var result = await res.json().catch(function(){ return {}; });
      if (!res.ok || !result.ok || !result.topic) {
        throw new Error(result.error || 'AI 話題生成失敗（HTTP ' + res.status + '）');
      }
      aiTopicValue = String(result.topic).trim();
      aiTopicHint.textContent = aiTopicValue;
      aiTopicUseBtn.style.display = '';
    } catch (err) {
      aiTopicHint.textContent = err.message || 'AI 話題生成失敗';
      aiTopicUseBtn.style.display = 'none';
    } finally {
      aiTopicBtn.disabled = false;
      aiTopicBusy = false;
    }
  }

  async function generateAICover(box) {
    if (!box) return null;
    var res = await fetch(API + '/api/ai-cover', {
      method: 'POST',
      headers: {'Content-Type':'application/json','X-Access-Code':accessCode},
      body: JSON.stringify({ boxId: box.id })
    });
    var result = await res.json().catch(function(){ return {}; });
    if (!res.ok || !result.ok) throw new Error(result.error || 'AI 封面生成失敗（HTTP ' + res.status + '）');
    box.aiTitle = result.title || result.summary || '';
    box.aiTheme = result.theme || '';
    box.aiSummary = result.summary || result.title || '';
    box.aiCoverFileId = null;
    box.aiReplyCount = (box.replies || []).length;
    return result;
  }
  async function refreshAICover(box, showStatus) {
    if (!box || aiBusy) return;
    aiBusy = true;
    aiRefreshBtn.disabled = true;
    try {
      if (showStatus !== false) setStatus('AI 正在分析這個盒子的聊天內容…');
      await generateAICover(box);
      render();
      renderAiCover(box);
      mutate();
      setStatus('AI 封面文字與主題已更新');
    } catch (err) {
      setStatus(err.message || 'AI 封面生成失敗', true);
    } finally {
      aiRefreshBtn.disabled = false;
      aiBusy = false;
    }
  }

  async function ensureMissingAICovers() {
    // 只補尚未有「對話摘要」的盒子，避免每次重新整理都消耗 Gemini 配額。
    var missing = state.boxes.filter(function(box){
      return !(String(box.aiSummary || '').trim() || String(box.aiTitle || '').trim());
    });
    for (var i = 0; i < missing.length && i < MAX_BOXES; i++) {
      await refreshAICover(missing[i], false);
    }
  }

  async function submitReply() {
    if (!openBoxId) return;
    var text = replyInput.value.trim();
    var file = replyImageInput.files && replyImageInput.files[0];
    if (!text && !file) return;
    var box = state.boxes.find(function(b){return b.id === openBoxId;});
    if (!box) return;
    sendReplyBtn.disabled = true;
    try {
      setStatus('正在上傳回覆…');
      var imageFileId = file ? await uploadImage(file) : null;
      box.replies = box.replies || [];
      box.replies.push({
        id: 'r' + Date.now() + Math.random().toString(16).slice(2,6),
        text: text, imageFileId: imageFileId, ts: Date.now(), by: userId,
        replyTo: replyingTo ? Object.assign({}, replyingTo) : null
      });
      replyInput.value = '';
      replyImageInput.value = '';
      replyImageName.textContent = '';
      renderReplies(box);
      setReplyQuote(null);
      state.readBy[userId][box.id] = Date.now();
      var replySavePromise = mutate();
      setStatus('回覆已送出');
      if ((box.replies || []).length - (box.aiReplyCount || 0) >= 5) {
        replySavePromise.then(function(saved){
          if (saved) setTimeout(function(){ refreshAICover(box, false); }, 50);
        });
      }
    } catch (err) {
      setStatus(err.message || '圖片上傳失敗', true);
    } finally {
      sendReplyBtn.disabled = false;
    }
  }
  sendReplyBtn.addEventListener('click', submitReply);
  replyInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){e.preventDefault();submitReply();}
  });
  replyImageInput.addEventListener('change', function(){
    replyImageName.textContent = replyImageInput.files[0] ? replyImageInput.files[0].name : '';
  });
  boxImageInput.addEventListener('change', function(){
    boxImageName.textContent = boxImageInput.files[0] ? boxImageInput.files[0].name : '';
  });

  aiTopicBtn.addEventListener('click', generateAITopic);
  aiTopicUseBtn.addEventListener('click', function(){
    if (!aiTopicValue) return;
    if (!textInput.value.trim()) {
      textInput.value = aiTopicValue;
    } else {
      textInput.value += (textInput.value.endsWith(' ') ? '' : ' ') + aiTopicValue;
    }
    textInput.focus();
    aiTopicUseBtn.style.display = 'none';
  });

  pingBtn.addEventListener('click', function(){
    state.onlinePingAt = Date.now();
    pingBtn.classList.add('sent');
    setTimeout(function(){pingBtn.classList.remove('sent');},1200);
    mutate();
    setStatus('已送出上線訊號');
  });

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    var text = textInput.value.trim();
    var file = boxImageInput.files && boxImageInput.files[0];
    if (!text && !file) { setStatus('請輸入文字或附上一張圖片。', true); return; }
    if (state.boxes.length >= MAX_BOXES) {
      setStatus('目前最多 5 個盒子，請先刪除一個。', true);
      return;
    }
    submitBtn.disabled = true;
    try {
      setStatus(file ? '正在上傳圖片…' : '正在建立盲盒…');
      var imageFileId = file ? await uploadImage(file) : null;
      var checked = form.querySelector('input[name="mood"]:checked');
      var newBox = {
        id:'b'+Date.now()+Math.random().toString(16).slice(2,6),
        text:text, imageFileId:imageFileId, mood:checked ? checked.value : 'life',
        ts:Date.now(), replies:[], aiReplyCount:0
      };
      state.boxes.push(newBox);
      textInput.value = '';
      boxImageInput.value = '';
      boxImageName.textContent = '';
      var savedNewBox = await mutate();
      setStatus(savedNewBox ? '盲盒已建立，AI 正在分析主題…' : '盲盒已建立，正在等待同步…');
      if (savedNewBox) {
        try {
          await refreshAICover(newBox, false);
        } catch (_) {}
      }
    } catch (err) {
      setStatus(err.message || '建立盲盒失敗', true);
    } finally {
      submitBtn.disabled = false;
    }
  });

  function normalizeState(s) {
    s = s && typeof s === 'object' ? s : {};
    s.boxes = Array.isArray(s.boxes) ? s.boxes : [];
    s.boxes.forEach(function(b){
      if(!Array.isArray(b.replies)) b.replies = [];
      b.aiTitle = b.aiTitle || '';
      b.aiTheme = b.aiTheme || '';
      b.aiSummary = b.aiSummary || '';
      b.aiCoverFileId = null;
      b.aiReplyCount = Number.isFinite(b.aiReplyCount) ? b.aiReplyCount : (b.replies.length ? 0 : 0);
      b.replies.forEach(function(r){ r.replyTo = r.replyTo || null; });
    });
    s.readBy = s.readBy && typeof s.readBy === 'object' ? s.readBy : {};
    s.lastOpenedAt = s.lastOpenedAt || null;
    s.onlinePingAt = s.onlinePingAt || null;
    return s;
  }
  function loadState() {
    return fetch(API + '/api/state', {
      headers: {'X-Access-Code':accessCode}
    }).then(function(res){
      if(res.status === 401) throw new Error('通行碼錯誤，請重新整理並輸入正確通行碼。');
      if(!res.ok) throw new Error('讀取失敗（HTTP ' + res.status + '）');
      return res.json();
    }).then(function(payload){
      userId = payload.user;
      state = normalizeState(payload.state);
      render();
      setStatus('');
      // 僅在通行碼驗證成功、雲端資料載入成功後發送 Telegram 通知
      notifyVisit();
    });
  }
  function notifyVisit() {
    fetch(API + '/api/visit', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({event:'盲盒網站登入成功｜使用者：' + (userId === 'A' ? 'A' : userId === 'B' ? 'B' : userId)}),
      keepalive:true
    }).catch(function(){});
  }

  if (!accessCode) {
    accessCode = window.prompt('請輸入你的盲盒信箱通行碼（由信箱建立者提供）') || '';
  }
  if (!accessCode) {
    setStatus('尚未輸入通行碼。重新整理頁面即可再試。', true);
    form.querySelectorAll('input,textarea,button').forEach(function(el){el.disabled=true;});
    return;
  }
  sessionStorage.setItem('blindbox_access_code', accessCode);

  loadState().then(function(){
    // 先顯示盒子，再補齊舊盒子的 AI 對話摘要封面。
    window.setTimeout(function(){ ensureMissingAICovers().catch(function(){}); }, 150);
    window.setInterval(function(){
      if (dirty || Date.now() - lastLocalMutation < 2500) return;
      fetch(API + '/api/state', {
        headers:{'X-Access-Code':accessCode}
      }).then(function(res){
        if(!res.ok) return;
        return res.json();
      }).then(function(payload){
        if(!payload || dirty) return;
        state = normalizeState(payload.state);
        render();
        if(openBoxId) {
          var current = state.boxes.find(function(b){return b.id === openBoxId;});
          if(current) {
            noteText.textContent = current.text || '';
            noteImage.style.display = current.imageFileId ? 'block' : 'none';
            noteImage.src = current.imageFileId ? API + '/api/image?file_id=' + encodeURIComponent(current.imageFileId) : '';
            renderReplies(current);
            renderAiCover(current);
          } else closeNote();
        }
      }).catch(function(){});
    }, POLL_MS);
  }).catch(function(err){
    sessionStorage.removeItem('blindbox_access_code');
    setStatus(err.message || '無法連接雲端 API。', true);
    window.alert(err.message || '無法連接雲端 API。請確認 Worker 已部署。');
  });
})();
</script>
